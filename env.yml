name: multi_gnn-env
channels:
  - pyg
  - pytorch
  - nvidia
  - conda-forge
  - defaults
dependencies:
  - python=3.9
  - pip

  # Core
  - pytorch
  - torchvision
  - pytorch-cuda=11.8

  # Scientific stack
  - numpy>=1.25.2
  - pandas=2.0.3
  - scipy
  - scikit-learn=1.3.0
  - matplotlib
  - tqdm
  - tabulate=0.9.0
  - datatable
  - munch

  # Jupyter
  - ipykernel
  - ipython
  - ipywidgets

  # Compression libs (keep if you actually need them)
  - bzip2=1.0.8
  - lz4
  - zstd
  - zstandard

  # IMPORTANT: pip-installed PyG wheels + wandb
  - pip:
      - wandb==0.22.3
      - pyg-lib==0.4.0+pt24cpu
      - torch-scatter==2.1.2+pt24cpu
      - torch-sparse==0.6.18+pt24cpu

